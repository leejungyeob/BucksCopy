services:
  paper-runner:
    build:
      context: ..
      dockerfile: Server/Dockerfile
    container_name: bucks-copy-paper-runner
    restart: unless-stopped
    environment:
      BUCKS_COPY_DATA_DIR: /var/lib/bucks-copy
      BUCKS_COPY_SYMBOLS: ${BUCKS_COPY_SYMBOLS:-BTCUSDT,ETHUSDT}
      BUCKS_COPY_CANDLE_LIMIT: ${BUCKS_COPY_CANDLE_LIMIT:-0}
      BUCKS_COPY_FETCH_CANDLE_LIMIT: ${BUCKS_COPY_FETCH_CANDLE_LIMIT:-1000}
      BUCKS_COPY_HISTORY_BACKFILL_PAGES_PER_CYCLE: ${BUCKS_COPY_HISTORY_BACKFILL_PAGES_PER_CYCLE:-800}
      BUCKS_COPY_POLL_SECONDS: ${BUCKS_COPY_POLL_SECONDS:-30}
      BUCKS_COPY_PRIVATE_POLL_SECONDS: ${BUCKS_COPY_PRIVATE_POLL_SECONDS:-60}
      BUCKS_COPY_LIVE_ORDER_EXECUTION_ENABLED: ${BUCKS_COPY_LIVE_ORDER_EXECUTION_ENABLED:-false}
      BUCKS_COPY_LIVE_ORDER_MARGIN_USDT: ${BUCKS_COPY_LIVE_ORDER_MARGIN_USDT:-0}
      BUCKS_COPY_LIVE_AVAILABLE_BALANCE_RATIO: ${BUCKS_COPY_LIVE_AVAILABLE_BALANCE_RATIO:-1}
      BUCKS_COPY_LIVE_MARGIN_MODE: ${BUCKS_COPY_LIVE_MARGIN_MODE:-isolated}
      BUCKS_COPY_LIVE_POSITION_MODE: ${BUCKS_COPY_LIVE_POSITION_MODE:-hedge}
      BUCKS_COPY_DEFAULT_USER_ID: ${BUCKS_COPY_DEFAULT_USER_ID:-local-admin}
      BUCKS_COPY_AUTH_USERS_PATH: /var/lib/bucks-copy/auth-users.json
      BUCKS_COPY_REQUIRE_AUTH: ${BUCKS_COPY_REQUIRE_AUTH:-false}
      BUCKS_COPY_CREDENTIAL_ENCRYPTION_KEY: ${BUCKS_COPY_CREDENTIAL_ENCRYPTION_KEY:-}
      BUCKS_COPY_API_HOST: 0.0.0.0
      BUCKS_COPY_API_PORT: 8787
    ports:
      - "127.0.0.1:${BUCKS_COPY_API_PORT:-8787}:8787"
    volumes:
      - ${BUCKS_COPY_HOST_DATA_DIR:-../server-data}:/var/lib/bucks-copy
      - ${BUCKS_COPY_HOST_LOG_DIR:-../server-logs}:/var/log/bucks-copy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
